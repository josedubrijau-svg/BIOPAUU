<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apuntes — BioPAU VIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body data-requires-plan data-page="apuntes">

<div class="layout">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <div class="content protected">

      <div class="notice" id="setup-notice">
        <span>⚙️</span>
        <span><b>Falta un paso:</b> ejecuta <code>supabase/dashboard-schema.sql</code> en Supabase para poder guardar tu progreso.</span>
      </div>

      <section class="hello">
        <h1>Apuntes</h1>
        <p id="temario-resumen">Todo el temario oficial, por bloques.</p>
      </section>

      <div id="temario"></div>

      <p style="color:var(--txt-dim);font-size:.86rem;margin-top:28px">
        Toca la etiqueta de estado de cada tema para marcarlo como <b>en curso</b> o <b>completado</b>.
        Tu progreso actualiza el nivel y las sugerencias del dashboard.
      </p>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/supabaseClient.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/study-data.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/progress.js"></script>
<script src="/js/apuntes.js"></script>
</body>
</html>
