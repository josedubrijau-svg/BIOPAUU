<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="cal.title">Calendario — BioPAU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/i18n.css">
<script defer src="/js/i18n.js"></script>
<style>
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
  .cal-head h2{font-size:1.25rem}
  .cal-nav{display:flex;gap:8px}
  .cal-nav button{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.1rem;color:var(--txt-soft)}
  .cal-nav button:hover{background:rgba(173,232,12,.1);color:var(--lime)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .cal-dow{text-align:center;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;color:var(--txt-dim);padding-bottom:6px}
  .cal-day{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);
    display:grid;place-items:center;font-weight:600;font-size:.95rem;color:var(--txt-soft);position:relative;transition:all .16s var(--ease)}
  .cal-day:hover{border-color:rgba(173,232,12,.45);color:var(--txt);transform:translateY(-2px)}
  .cal-day.is-done{background:rgba(173,232,12,.2);border-color:rgba(173,232,12,.5);color:var(--lime)}
  .cal-day.is-today{box-shadow:inset 0 0 0 2px rgba(255,255,255,.28)}
  .cal-day.is-pau{background:rgba(255,138,138,.16);border-color:rgba(255,138,138,.5);color:#FF8A8A}
  .cal-tag{position:absolute;bottom:3px;font-family:var(--mono);font-size:.5rem;letter-spacing:.08em}
  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;font-size:.84rem;color:var(--txt-dim)}
  .legend span{display:flex;align-items:center;gap:7px}
  .legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
</style>
</head>
<body data-requires-plan data-page="calendario">

<div class="layout">
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <div class="content protected">

      <div class="notice" id="setup-notice">
        <span>⚙️</span>
        <span data-i18n-html="cal.setup"><b>Falta un paso:</b> ejecuta <code>supabase/dashboard-schema.sql</code> en Supabase para guardar tus días de estudio.</span>
      </div>

      <section class="hello">
        <h1 data-i18n="cal.h1">Tu calendario de estudio</h1>
        <p data-i18n="cal.intro">Marca los días que estudias. Mantener la racha es lo que marca la diferencia.</p>
      </section>

      <section class="card">
        <div class="cal-head">
          <h2 id="cal-title">—</h2>
          <div style="display:flex;align-items:center;gap:14px">
            <span id="cal-resumen" style="font-family:var(--mono);font-size:.75rem;color:var(--txt-dim)"></span>
            <div class="cal-nav">
              <button id="cal-prev" aria-label="Mes anterior">‹</button>
              <button id="cal-next" aria-label="Mes siguiente">›</button>
            </div>
          </div>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div class="legend">
          <span><i style="background:rgba(173,232,12,.5)"></i> <span data-i18n="cal.leg_studied">Día estudiado</span></span>
          <span><i style="background:rgba(255,255,255,.28)"></i> <span data-i18n="cal.leg_today">Hoy</span></span>
          <span><i style="background:rgba(255,138,138,.6)"></i> <span data-i18n="cal.leg_pau">Examen PAU</span></span>
        </div>
      </section>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/supabaseClient.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/study-data.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/progress.js"></script>
<script src="/js/calendario.js"></script>
</body>
</html>
