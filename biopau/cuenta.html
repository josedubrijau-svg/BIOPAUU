<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="acc.title">Mi cuenta — BioPAU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/i18n.css">
<script defer src="/js/i18n.js"></script>
<style>
  /* ---- Mi cuenta: espacio personal (deriva de la paleta del dashboard) ---- */
  .acc-shell{max-width:960px;margin:0 auto;padding:clamp(18px,2.6vw,30px)}
  .acc-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:clamp(20px,4vw,34px)}
  .acc-top .sb-logo{font-size:1.25rem}
  .acc-top-right{display:flex;align-items:center;gap:14px}
  .acc-back{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--txt-soft);border:1px solid var(--line);border-radius:100px;padding:8px 14px;transition:background .18s var(--ease),color .18s var(--ease)}
  .acc-back:hover{background:rgba(173,232,12,.1);color:var(--txt)}
  .acc-back .arw{transition:transform .2s var(--ease)}
  .acc-back:hover .arw{transform:translateX(-3px)}

  /* Cabecera personal */
  .acc-hero{display:flex;align-items:center;gap:22px;margin-bottom:26px;flex-wrap:wrap}
  .acc-portrait{width:84px;height:84px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 30%,rgba(173,232,12,.22),rgba(173,232,12,.05));border:2px solid rgba(173,232,12,.4)}
  .acc-portrait svg{width:52px;height:52px}
  .acc-hero-txt{flex:1;min-width:220px}
  .acc-hero-txt h1{font-size:clamp(1.6rem,3.6vw,2.4rem);line-height:1.05}
  .acc-hero-txt h1 .accent{color:var(--lime)}
  .acc-hero-txt .card-sub{margin-bottom:.35rem;display:block}
  .acc-hero-sub{color:var(--txt-soft);margin-top:.3rem}
  .acc-hero-badge{margin-left:auto}

  /* Rejilla de datos + acciones */
  .acc-cols{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-bottom:18px}
  .acc-dl{display:grid;grid-template-columns:1fr 1fr;gap:2px 22px;margin-top:16px}
  .acc-row{padding:12px 0;border-bottom:1px solid var(--line)}
  .acc-row .k{font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--txt-dim)}
  .acc-row .v{font-family:var(--display);font-weight:700;font-size:1.06rem;color:var(--txt);margin-top:3px;word-break:break-word}

  .acc-actions-card{display:flex;flex-direction:column}
  .acc-actions{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .acc-actions .btn{width:100%}

  .badge{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.72rem;font-weight:700;letter-spacing:.04em;
    padding:.34rem .7rem;border-radius:100px;border:1px solid var(--line);color:var(--txt-soft)}
  .badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
  .badge--on{background:rgba(173,232,12,.14);color:var(--lime);border-color:rgba(173,232,12,.35)}
  .badge--off{background:rgba(255,255,255,.04);color:var(--txt-dim)}

  /* Formulario editar datos */
  .field{margin:16px 0 4px;text-align:left}
  .field label{display:block;font-family:var(--mono);font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--txt-dim);margin-bottom:.45rem}
  .field input{width:100%;font-family:var(--body);font-size:1rem;color:var(--txt);background:rgba(255,255,255,.03);
    border:1px solid var(--line);border-radius:12px;padding:.72rem .85rem;transition:border-color .16s ease,box-shadow .16s ease}
  .field input:focus{outline:none;border-color:rgba(173,232,12,.5);box-shadow:0 0 0 3px rgba(173,232,12,.14)}
  .msg{display:none;margin:2px 0 12px;padding:.7rem .9rem;border-radius:12px;font-weight:600;font-size:.92rem;border:1px solid var(--line)}
  .msg--error{background:rgba(255,138,138,.1);color:#FF9E9E;border-color:rgba(255,138,138,.4)}
  .msg--success{background:rgba(173,232,12,.1);color:var(--lime);border-color:rgba(173,232,12,.35)}
  .msg--info{background:rgba(123,211,247,.1);color:#9AD8F5;border-color:rgba(123,211,247,.35)}

  @media(max-width:720px){
    .acc-cols{grid-template-columns:1fr}
    .acc-dl{grid-template-columns:1fr}
    .acc-hero-badge{margin-left:0;width:100%}
  }
</style>
</head>
<body data-requires-auth data-page="cuenta">

<div class="acc-shell">

  <header class="acc-top">
    <a href="/index.html" class="sb-logo"><span class="cell"></span>Bio<b>PAU</b></a>
    <div class="acc-top-right">
      <div data-lang-switch></div>
      <a href="/index.html" class="acc-back"><span class="arw">←</span> <span data-i18n="acc.back">Inicio</span></a>
    </div>
  </header>

  <main class="protected">

    <section class="acc-hero">
      <div class="acc-portrait" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="17" r="9" fill="#ADE80C"/>
          <path d="M8 42c0-9 7.6-15 16-15s16 6 16 15" fill="#ADE80C"/>
        </svg>
      </div>
      <div class="acc-hero-txt">
        <span class="card-sub" data-i18n="acc.eyebrow">Mi cuenta</span>
        <h1>Hola, <span class="accent" id="hello-name">…</span>.</h1>
        <p class="acc-hero-sub" data-i18n="acc.hello_sub">Este es tu espacio en BioPAU.</p>
      </div>
      <div class="acc-hero-badge"><span id="acc-status" class="badge badge--off">—</span></div>
    </section>

    <div class="acc-cols">
      <section class="card">
        <span class="card-sub" data-i18n="acc.info_title">Tus datos</span>
        <div class="acc-dl">
          <div class="acc-row"><div class="k" data-i18n="acc.username">Usuario</div><div class="v" id="acc-username">—</div></div>
          <div class="acc-row"><div class="k" data-i18n="acc.email">Email</div><div class="v" id="acc-email">—</div></div>
          <div class="acc-row"><div class="k" data-i18n="acc.member_since">Miembro desde</div><div class="v" id="acc-created">—</div></div>
          <div class="acc-row"><div class="k" data-i18n="acc.plan">Plan</div><div class="v" id="acc-plan">—</div></div>
          <div class="acc-row"><div class="k" data-i18n="acc.payment">Pago</div><div class="v" id="acc-payment">—</div></div>
        </div>
      </section>

      <section class="card acc-actions-card">
        <span class="card-sub" data-i18n="acc.actions_title">Tu cuenta</span>
        <div class="acc-actions">
          <a href="/app/" id="btn-premium" class="btn" style="display:none"><span data-i18n="acc.go_study">Ir al área de estudio</span> <span class="arw">→</span></a>
          <a href="/precios.html" id="btn-subscribe" class="btn"><span data-i18n="acc.subscribe">Suscribirme</span> <span class="arw">→</span></a>
          <button id="btn-portal" class="btn btn--ghost" style="display:none" data-i18n="acc.manage">Gestionar suscripción</button>
          <button data-logout class="btn btn--ghost" data-i18n="acc.logout">Cerrar sesión</button>
        </div>
      </section>
    </div>

    <section class="card">
      <span class="card-sub" data-i18n="acc.edit_title">Editar datos</span>
      <div id="acc-msg" class="msg"></div>
      <form id="form-username" novalidate>
        <div class="field">
          <label for="username" data-i18n="acc.username_label">Nombre de usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" required>
        </div>
        <button type="submit" class="btn" data-i18n="acc.save">Guardar cambios</button>
      </form>
    </section>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/supabaseClient.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/account.js"></script>
</body>
</html>
