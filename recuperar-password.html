<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="rec.title">Recuperar contraseña — BioPAU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/auth.css">
<link rel="stylesheet" href="/css/i18n.css">
<script defer src="/js/i18n.js"></script>
<link rel="stylesheet" href="/css/nav-loading.css">
<script defer src="/js/nav-loading.js"></script>
<link rel="stylesheet" href="/css/fase-a.css">
<script defer src="/js/fase-a.js"></script>
</head>
<body>
<nav><div class="nav-in">
  <a href="/index.html" class="logo"><span class="cell"></span>Bio<b>PAU</b></a>
  <div class="nav-right">
    <div data-lang-switch></div>
    <div id="nav-auth" class="nav-auth">
      <a href="/login.html" class="nav-link" data-i18n="nav.enter">Entrar</a>
      <a href="/registro.html" class="btn" data-i18n="nav.start_free">Empieza gratis</a>
    </div>
  </div>
</div></nav>

<main>
  <div class="card">
    <span class="eyebrow" data-i18n="rec.eyebrow">Recuperar acceso</span>
    <h1 data-i18n="rec.h1">¿Olvidaste la contraseña?</h1>
    <p class="sub" data-i18n="rec.sub">Escribe tu email y te enviaremos un enlace para crear una nueva.</p>

    <div id="form-msg" class="msg"></div>
    <form id="form-recuperar" novalidate>
      <div class="field">
        <label for="email" data-i18n="field.email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@email.com" data-i18n-attr="placeholder:field.email_ph" required>
      </div>
      <button type="submit" class="btn btn--wide"><span data-i18n="rec.submit">Enviar enlace</span> <span class="arw">→</span></button>
    </form>

    <p class="alt"><a href="/login.html" class="link" data-i18n="rec.back_login">Volver a iniciar sesión</a></p>
  </div>
</main>

<footer><div class="foot-in">
  <a href="/index.html" class="logo"><span class="cell"></span>Bio<b>PAU</b></a>
  <div class="links"><a href="/precios.html" data-i18n="foot.prices">Precios</a><a href="/registro.html" data-i18n="foot.create">Crear cuenta</a></div>
</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/config.js"></script>
<script src="/js/supabaseClient.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
